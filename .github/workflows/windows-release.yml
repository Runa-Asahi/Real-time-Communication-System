name: Windows Build & Release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release with zip artifact'
        type: boolean
        default: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          modules: ''
          tools: 'tools_mingw1310'
          cache: true

      - name: Add MinGW to PATH
        shell: bash
        run: |
          echo "$IQTA_TOOLS/mingw1310_64/bin" >> "$GITHUB_PATH"
          echo "$Qt6_DIR/bin" >> "$GITHUB_PATH"
          g++ --version
          qmake6 --version || qmake --version

      - name: Configure & Build
        shell: bash
        run: |
          QT_PREFIX="${Qt6_DIR:-$Qt5_DIR}"
          cmake -S . -B build -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DFANLX_BUILD_GUI=ON \
            -DFANLX_BUILD_CLI=ON \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DFANLX_SQLITE_DLL="C:/Windows/System32/winsqlite3.dll"
          cmake --build build --parallel 4

      - name: Test
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cp "$Qt6_DIR"/bin/Qt6Core.dll "$Qt6_DIR"/bin/Qt6Gui.dll "$Qt6_DIR"/bin/Qt6Widgets.dll build/ || true
          mkdir -p build/platforms && cp "$Qt6_DIR"/plugins/platforms/*.dll build/platforms/ || true
          ctest --test-dir build --output-on-failure -LE perf --timeout 600

      - name: Upload GUI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-screenshots
          path: build/gui-screenshots
          if-no-files-found: ignore

      - name: Package
        shell: pwsh
        run: |
          $qtRoot = if ($env:Qt6_DIR) { $env:Qt6_DIR } else { $env:QT_ROOT_DIR }
          $qtBin = Join-Path $qtRoot 'bin'
          if (-not (Test-Path $qtBin)) { $qtBin = Join-Path $env:IQTA_TOOLS 'Qt/6.10.1/mingw_64/bin' }
          $mingw = Join-Path $env:IQTA_TOOLS 'mingw1310_64/bin'
          powershell -File scripts/package-release.ps1 -BuildDir build -QtBin $qtBin -MinGwBin $mingw -Version "${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}"
          Compress-Archive -Path dist/Ciallo/* -DestinationPath "Ciallo-${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}-windows-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ciallo-windows-x64
          path: Ciallo-*-windows-x64.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v1.0.0-ci-{0}', github.run_number) }}
          name: Ciallo ${{ github.ref_type == 'tag' && github.ref_name || format('v1.0.0-ci-{0}', github.run_number) }}
          body: |
            ## Ciallo 发布包（Windows x64）

            解压后双击 `Ciallo.bat` 即可本机使用。
            局域网请看包内 `使用说明.md`。

            演示账号：`2026001` / `2026002` / `2026003`，密码均为 `123`。
          files: Ciallo-*-windows-x64.zip
          draft: ${{ github.ref_type != 'tag' }}
          prerelease: ${{ github.ref_type != 'tag' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
